<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Image ko WebP mein convert karein, size limit ke andar. 100% browser mein.">
<meta name="theme-color" content="#0f172a">
<title>Image to WebP Converter (Max 18KB)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .container { width: 100%; max-width: 520px; }
  h1 { font-size: 22px; margin-bottom: 4px; text-align: center; }
  p.subtitle {
    text-align: center; color: #94a3b8; font-size: 14px;
    margin-top: 0; margin-bottom: 24px;
  }
  .settings {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px 12px;
    align-items: center;
    margin-bottom: 16px;
    background: #1e293b;
    border: 0;
    border-radius: 12px;
    padding: 14px;
  }
  .settings label { font-size: 13px; color: #94a3b8; }
  .settings input[type=number],
  .settings select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  .settings input[type=number] { max-width: 100px; }
  .settings .switch { display: flex; align-items: center; gap: 8px; color: #e2e8f0; cursor: pointer; }
  .settings .switch input { width: 18px; height: 18px; accent-color: #38bdf8; }
  .drop-zone {
    display: block;
    border: 2px dashed #475569;
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #1e293b;
  }
  .drop-zone.dragover, .drop-zone:focus-within { border-color: #38bdf8; background: #1e2b3f; }
  .drop-zone .icon { font-size: 32px; }
  .drop-zone p { margin: 8px 0 0; color: #94a3b8; font-size: 14px; }
  .drop-zone input[type=file] {
    position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden;
  }
  #status {
    margin-top: 16px; font-size: 14px; color: #94a3b8;
    text-align: center; min-height: 20px;
  }
  .error { color: #f87171; font-size: 13px; text-align: center; margin-top: 10px; }
  .list-item {
    background: #1e293b;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .list-item img {
    width: 56px; height: 56px; object-fit: cover;
    border-radius: 6px; flex-shrink: 0;
  }
  .list-item .meta { flex: 1; min-width: 0; font-size: 13px; }
  .list-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item .size { color: #94a3b8; font-size: 12px; }
  .list-item a {
    background: #38bdf8; color: #0f172a;
    padding: 8px 12px; border-radius: 6px;
    text-decoration: none; font-size: 13px; font-weight: 600;
    flex-shrink: 0;
  }
  .list-item a:active { opacity: 0.8; }
  footer { margin-top: 32px; font-size: 12px; color: #64748b; text-align: center; }
</style>
</head>
<body>
<main class="container">
  <header>
    <h1>Image → WebP Converter</h1>
    <p class="subtitle">Kisi bhi image ko WebP format mein convert karein, size hamesha target limit ke andar</p>
  </header>

  <section class="settings" aria-label="Settings">
    <label for="targetKb">Max size (KB):</label>
    <input type="number" id="targetKb" value="18" min="1" max="500">
    <label for="wmToggle">Watermark:</label>
    <label class="switch"><input type="checkbox" id="wmToggle" checked> "Relationship Cues" lagayein</label>
  </section>

  <label class="drop-zone" id="dropZone" for="fileInput">
    <div class="icon" aria-hidden="true">📁</div>
    <p>Image yahan drop karein ya tap karke choose karein<br>(ek se zyada images bhi chal sakti hain)</p>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="results"></div>

  <footer>100% browser mein chalta hai — koi image kisi server par upload nahi hoti.</footer>
</main>

<script>
'use strict';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const targetKbInput = document.getElementById('targetKb');
const wmToggle = document.getElementById('wmToggle');

const WATERMARK_TEXT = 'Relationship Cues';

// Watermark: bottom-right corner, image width ka ~26% size, har background par readable
function drawWatermark(ctx, width, height) {
  if (!wmToggle.checked || width < 80 || height < 40) return;

  const family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const targetTextWidth = width * 0.26;

  // Pehle 100px par naap kar font size scale karein
  ctx.font = `600 100px ${family}`;
  const baseWidth = ctx.measureText(WATERMARK_TEXT).width;
  let fontSize = (targetTextWidth / baseWidth) * 100;
  fontSize = Math.max(9, Math.min(fontSize, height * 0.1, 48));

  const margin = Math.max(6, Math.min(width, height) * 0.03);

  ctx.save();
  ctx.font = `600 ${fontSize}px ${family}`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  const x = width - margin;
  const y = height - margin;

  // Halka dark outline + white fill: light aur dark dono backgrounds par dikhe
  ctx.globalAlpha = 0.75;
  ctx.lineWidth = Math.max(1.5, fontSize * 0.14);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.strokeText(WATERMARK_TEXT, x, y);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(WATERMARK_TEXT, x, y);
  ctx.restore();
}

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  fileInput.value = ''; // same file dobara choose karne ke liye
});

function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (files.length === 0) return;
  const targetKb = parseFloat(targetKbInput.value) || 18;
  statusEl.textContent = `Processing ${files.length} image(s)...`;
  files.forEach(file => processImage(file, targetKb));
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image open nahi ho payi')); };
    img.src = url;
  });
}

// Canvas se WebP blob banane ka helper
function canvasToWebpBlob(canvas, quality) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), 'image/webp', quality);
  });
}

async function compressToTarget(img, targetBytes) {
  let width = img.naturalWidth;
  let height = img.naturalHeight;

  // Agar image bahut badi hai, ek reasonable starting point set karein
  const MAX_DIMENSION = 2000;
  if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
    const scale = MAX_DIMENSION / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }

  let bestBlob = null;

  // Outer loop: agar quality kam karne se bhi target na mile, to dimensions ghatao
  while (width >= 16 && height >= 16) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    drawWatermark(ctx, width, height);

    // Binary search quality (0.02 to 0.95) is dimension ke liye
    let lo = 0.02, hi = 0.95;

    // Pehle check karein ki lowest quality par bhi target milta hai ya nahi
    const lowestBlob = await canvasToWebpBlob(canvas, lo);
    if (!lowestBlob) return bestBlob;

    if (lowestBlob.size > targetBytes) {
      // Is dimension par bhi nahi ho pa raha — dimension chhota karo
      if (!bestBlob || lowestBlob.size < bestBlob.size) bestBlob = lowestBlob;
      width = Math.round(width * 0.85);
      height = Math.round(height * 0.85);
      continue;
    }

    let found = lowestBlob;
    for (let i = 0; i < 8; i++) {
      const mid = (lo + hi) / 2;
      const blob = await canvasToWebpBlob(canvas, mid);
      if (blob && blob.size <= targetBytes) {
        found = blob;
        lo = mid;
      } else {
        hi = mid;
      }
    }

    bestBlob = found;
    break;
  }

  return bestBlob;
}

async function processImage(file, targetKb) {
  const targetBytes = targetKb * 1024;
  try {
    const { img, url } = await loadImage(file);
    const blob = await compressToTarget(img, targetBytes);
    URL.revokeObjectURL(url);

    if (!blob) {
      addErrorItem(file.name, 'Compression fail hua.');
      return;
    }

    const outUrl = URL.createObjectURL(blob);
    const sizeKb = (blob.size / 1024).toFixed(1);
    const withinLimit = blob.size <= targetBytes;
    const outName = file.name.replace(/\.[^/.]+$/, '') + '.webp';

    const item = document.createElement('div');
    item.className = 'list-item';

    const thumb = document.createElement('img');
    thumb.src = outUrl;
    thumb.alt = 'Converted image preview';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = outName;
    const sizeEl = document.createElement('div');
    sizeEl.className = 'size';
    sizeEl.textContent = `${sizeKb} KB ${withinLimit ? '✅' : '⚠️ target se zyada'}`;
    meta.append(nameEl, sizeEl);

    const link = document.createElement('a');
    link.href = outUrl;
    link.download = outName;
    link.textContent = 'Download';

    item.append(thumb, meta, link);
    resultsEl.appendChild(item);
    statusEl.textContent = 'Done!';
  } catch (err) {
    addErrorItem(file.name, 'Load fail hua: ' + err.message);
  }
}

function addErrorItem(name, msg) {
  const item = document.createElement('div');
  item.className = 'error';
  item.textContent = `${name}: ${msg}`;
  resultsEl.appendChild(item);
}
</script>
</body>
</html>
